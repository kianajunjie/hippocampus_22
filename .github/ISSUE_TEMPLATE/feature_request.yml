name: 功能建议
description: 想让她的记忆更像人一点
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说**要解决什么问题**，再谈实现。只描述方案容易被否，问题是共同的。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      placeholder: 聊到第三个月，她开始把两件旧事混在一起说，召回结果没法区分"哪件"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你想到的做法（可选）
      placeholder: 召回时按 topic 分组、同组只留最强的一条
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及环节
      multiple: true
      options:
        - 事件编码
        - 巩固与遗忘
        - 召回与确定度
        - 关系 / 事实 / 章节
        - 命令行
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 你能参与吗
      options:
        - label: 我可以提 PR
        - label: 我可以帮忙测
